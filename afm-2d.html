<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>AFM 2D Simulator</title>
    <style>
      :root,
      [data-theme="dark"] {
        --bg: #06080c;
        --panel: #0b1017;
        --border: #162230;
        --accent: #00e5b0;
        --accent2: #2ea8ff;
        --accent3: #ff7043;
        --accent4: #c97aff;
        --text: #6a8fa0;
        --text-hi: #b0d0e0;
        --canvas-bg: #040608;
        --grid1: #182434;
        --grid2: #0c1820;
        --axis: #9ab4c4;
        --border2: #1a2e3e;
      }
      [data-theme="light"] {
        --bg: #eef2f7;
        --panel: #ffffff;
        --border: #c5d5e5;
        --accent: #009e7a;
        --accent2: #1a7acc;
        --accent3: #d94f1e;
        --accent4: #8844cc;
        --text: #4a6070;
        --text-hi: #1a2838;
        --canvas-bg: #f8fafc;
        --grid1: #d0dce8;
        --grid2: #e4edf5;
        --axis: #456070;
        --border2: #c0d0e0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Courier New", monospace;
        font-size: 11px;
        display: flex;
        flex-direction: column;
        transition: background 0.2s, color 0.2s;
      }
      .topbar {
        display: flex;
        align-items: center;
        padding: 6px 10px;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        background: var(--bg);
      }
      .topbar a {
        font-size: 9px;
        color: var(--accent2);
        text-decoration: none;
        border: 1px solid rgba(46, 168, 255, 0.3);
        padding: 4px 10px;
      }
      .topbar a:hover {
        background: rgba(46, 168, 255, 0.08);
      }
      .title {
        flex: 1;
        text-align: center;
        font-size: 12px;
        letter-spacing: 4px;
        color: var(--accent);
        text-transform: uppercase;
      }
      .theme-toggle {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--accent);
        font-family: inherit;
        font-size: 9px;
        letter-spacing: 1px;
        padding: 4px 10px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .theme-toggle:hover {
        background: var(--accent);
        color: var(--bg);
      }
      .wrap {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .sidebar {
        width: 268px;
        flex-shrink: 0;
        overflow-y: auto;
        overflow-x: hidden;
        border-right: 1px solid var(--border);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sidebar::-webkit-scrollbar {
        width: 3px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: var(--border);
      }
      .main {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 8px;
        gap: 4px;
      }
      .cv-wrap {
        width: 100%;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--canvas-bg);
        border: 1px solid var(--border);
      }
      .cv-wrap.cv-main {
        flex: 1 1 200px;
      }
      .cv-wrap.cv-err {
        flex: 0 1 72px;
        min-height: 48px;
        max-height: 72px;
      }
      .cv-wrap.cv-fd {
        flex: 0 1 110px;
        min-height: 64px;
        max-height: 110px;
      }
      canvas.main-cv {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 8px;
      }
      .plabel {
        font-size: 8px;
        letter-spacing: 2px;
        color: var(--accent);
        text-transform: uppercase;
        margin-bottom: 6px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 3px;
      }
      .btn {
        display: block;
        width: 100%;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 4px 8px;
        font-family: inherit;
        font-size: 10px;
        cursor: pointer;
        text-align: left;
        margin-bottom: 3px;
      }
      .btn:hover {
        border-color: rgba(46, 168, 255, 0.4);
        color: var(--text-hi);
      }
      .btn.on {
        background: rgba(0, 229, 176, 0.08);
        border-color: var(--accent);
        color: var(--accent);
      }
      .tgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
        margin-bottom: 4px;
      }
      .tgl {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 4px 2px;
        font-family: inherit;
        font-size: 8px;
        cursor: pointer;
        text-align: center;
      }
      .tgl:hover {
        border-color: #ff6b35;
        color: var(--text-hi);
      }
      .tgl.on {
        background: rgba(255, 107, 53, 0.12);
        border-color: var(--accent3);
        color: var(--accent3);
      }
      .srow {
        display: flex;
        flex-direction: column;
        gap: 1px;
        margin-bottom: 4px;
      }
      .shdr {
        display: flex;
        justify-content: space-between;
        font-size: 7px;
        letter-spacing: 1px;
      }
      .shdr span:first-child {
        color: var(--text);
        opacity: 0.65;
        text-transform: uppercase;
      }
      .sval {
        color: var(--accent);
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
        height: 12px;
      }
      .prow {
        display: flex;
        gap: 3px;
        margin-bottom: 4px;
      }
      .pbtn {
        flex: 1;
        background: rgba(0, 229, 176, 0.08);
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 4px;
        font-family: inherit;
        font-size: 9px;
        cursor: pointer;
        letter-spacing: 1px;
      }
      .pbtn:hover {
        background: rgba(0, 229, 176, 0.2);
      }
      .ibtn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 4px 8px;
        font-family: inherit;
        font-size: 9px;
        cursor: pointer;
      }
      .ibtn:hover {
        border-color: var(--accent2);
        color: var(--accent2);
      }
      .mrow {
        display: flex;
        gap: 2px;
        margin-bottom: 4px;
      }
      .mbtn {
        flex: 1;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 3px 2px;
        font-family: inherit;
        font-size: 8px;
        cursor: pointer;
        text-align: center;
      }
      .mbtn.on {
        background: rgba(46, 168, 255, 0.1);
        border-color: var(--accent2);
        color: var(--accent2);
      }
      .rbtn {
        background: rgba(201, 122, 255, 0.1);
        border: 1px solid var(--accent4);
        color: var(--accent4);
        padding: 4px;
        font-family: inherit;
        font-size: 9px;
        cursor: pointer;
        width: 100%;
        letter-spacing: 1px;
      }
      .rbtn:hover {
        background: rgba(201, 122, 255, 0.2);
      }
      #tipPrev {
        display: block;
        width: 100%;
        height: 70px;
        background: var(--canvas-bg);
        border: 1px solid var(--border);
        margin-top: 4px;
      }
      .sgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
      }
      .sbox {
        background: var(--canvas-bg);
        border: 1px solid var(--border);
        padding: 3px 5px;
      }
      .slbl {
        font-size: 7px;
        letter-spacing: 1px;
        color: var(--text);
        text-transform: uppercase;
        opacity: 0.7;
      }
      .snum {
        font-size: 11px;
        font-weight: bold;
        color: var(--accent);
      }
      .snum.e {
        color: var(--accent3);
      }
      .snum.w {
        color: #f0c040;
      }
      .ibar {
        font-size: 9px;
        letter-spacing: 1px;
        color: var(--text);
        padding: 4px 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a href="index.html">← Home</a>
      <div class="title">AFM 2D Simulator</div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">◑ LIGHT</button>
    </div>
    <div class="wrap">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="panel">
          <div class="plabel">Tip Geometry</div>
          <div id="tipBtns">
            <button class="btn on" data-tip="cone">▼ Cone</button>
            <button class="btn" data-tip="sphere">● Spherical</button>
            <button class="btn" data-tip="hyperboloid">⌓ Hyperboloid</button>
            <button class="btn" data-tip="flat">▬ Flat Punch</button>
            <button class="btn" data-tip="inv_sphere">⌣ Concave Sphere</button>
            <button class="btn" data-tip="asymmetric">↗ Asymmetric</button>
            <button class="btn" data-tip="double_tip">⌤ Double Tip</button>
            <button class="btn" data-tip="sphere_cone">◓ Cone+Sphere</button>
          </div>
          <div id="tipSliders"></div>
          <canvas id="tipPrev" width="248" height="70"></canvas>
        </div>

        <div class="panel">
          <div class="plabel">Sample Surface</div>
          <div id="surfBtns">
            <button class="btn on" data-surf="sine">~ Sinusoidal</button>
            <button class="btn" data-surf="step">⌐ Step Edge</button>
            <button class="btn" data-surf="spike">△ Sharp Spike</button>
            <button class="btn" data-surf="hemisphere">● Nanoparticle</button>
            <button class="btn" data-surf="pit">○ Nano-pit</button>
            <button class="btn" data-surf="trench">⊓ Trenches</button>
            <button class="btn" data-surf="rough">≈ Rough</button>
            <button class="btn" data-surf="dna">⊛ DNA Ridges</button>
            <button class="btn" data-surf="chirp">≋ Chirp</button>
            <button class="btn" data-surf="lattice">⊞ 2D Lattice</button>
          </div>
          <div id="surfSliders"></div>
          <div class="srow" style="margin-top: 5px">
            <div class="shdr">
              <span>Noise</span><span class="sval" id="noiseVal">0 nm</span>
            </div>
            <input
              type="range"
              id="noiseSlider"
              min="0"
              max="10"
              step="0.5"
              value="0"
            />
          </div>
        </div>

        <div class="panel">
          <div class="plabel">Invert &amp; Transform</div>
          <div class="tgrid">
            <button class="tgl" id="tg_invZ" onclick="tog('invZ')">
              ↕ Inv Z
            </button>
            <button class="tgl" id="tg_mirrorX" onclick="tog('mirrorX')">
              ↔ Mirror X
            </button>
            <button class="tgl" id="tg_invTip" onclick="tog('invTip')">
              ⊙ Inv Tip
            </button>
            <button class="tgl" id="tg_revScan" onclick="tog('revScan')">
              ↩ Rev Scan
            </button>
            <button class="tgl" id="tg_erosion" onclick="tog('erosion')">
              ⊖ Erosion
            </button>
            <button class="tgl" id="tg_invErr" onclick="tog('invErr')">
              ⊘ Inv Err
            </button>
          </div>
          <button class="rbtn" onclick="randomizeAll()">🎲 RANDOMIZE</button>
        </div>

        <div class="panel">
          <div class="plabel">Scan Control</div>
          <div class="prow">
            <button class="pbtn" id="playBtn">▶ PLAY</button>
            <button class="ibtn" onclick="doReset()">↺</button>
          </div>
          <div class="mrow">
            <button class="mbtn" id="mSingle" onclick="setMode('single')">
              ONCE
            </button>
            <button class="mbtn on" id="mLoop" onclick="setMode('loop')">
              LOOP
            </button>
            <button class="mbtn" id="mBounce" onclick="setMode('bounce')">
              BOUNCE
            </button>
          </div>
          <div class="srow">
            <div class="shdr">
              <span>Speed</span><span class="sval" id="spdVal">3</span>
            </div>
            <input type="range" id="spdSlider" min="1" max="10" value="3" />
          </div>
          <div class="plabel" style="margin-top: 8px; margin-bottom: 4px">
            Height Map Export
          </div>
          <div class="mrow">
            <button class="ibtn export-hm-btn" id="exportTrueCsvBtn" style="flex: 1; font-size: 8px">
              ⬇ TRUE CSV
            </button>
            <button class="ibtn export-hm-btn" id="exportMeasCsvBtn" style="flex: 1; font-size: 8px">
              ⬇ MEAS CSV
            </button>
          </div>
          <div class="mrow">
            <button class="ibtn export-hm-btn" id="exportTruePngBtn" style="flex: 1; font-size: 8px">
              ⬇ TRUE PNG
            </button>
            <button class="ibtn export-hm-btn" id="exportMeasPngBtn" style="flex: 1; font-size: 8px">
              ⬇ MEAS PNG
            </button>
          </div>
          <div class="mrow">
            <button class="ibtn export-hm-btn" id="exportParamsBtn" style="flex: 1; font-size: 8px">
              ⬇ PARAMS
            </button>
            <button class="ibtn export-hm-btn" id="exportAllBtn" style="flex: 1; font-size: 8px">
              ⬇ ALL
            </button>
          </div>
        </div>

        <div class="panel">
          <div class="plabel">Stats</div>
          <div class="sgrid">
            <div class="sbox">
              <div class="slbl">Max Artifact</div>
              <div class="snum e" id="stArt">—</div>
            </div>
            <div class="sbox">
              <div class="slbl">RMS Error</div>
              <div class="snum w" id="stRms">—</div>
            </div>
          </div>
        </div>
      </div>
      <!-- sidebar -->

      <!-- MAIN -->
      <div class="main">
        <div class="cv-wrap cv-main">
          <canvas class="main-cv" id="cv0" width="700" height="520"></canvas>
        </div>
        <div class="cv-wrap cv-err">
          <canvas class="main-cv" id="cv1" width="700" height="70"></canvas>
        </div>
        <div class="cv-wrap cv-fd">
          <canvas class="main-cv" id="cv2" width="700" height="120"></canvas>
        </div>
        <div class="ibar" id="ibar">Ready — press PLAY</div>
      </div>
    </div>
    <!-- wrap -->

    <script>
      // ═══════════════════════════════════════════════════
      //  THEME (shared with index.html / afm-3d.html)
      // ═══════════════════════════════════════════════════
      (function () {
        const s = localStorage.getItem("afm-theme") || "dark";
        document.documentElement.setAttribute("data-theme", s);
        document.addEventListener("DOMContentLoaded", () => {
          const b = document.getElementById("themeToggle");
          if (b) b.textContent = s === "dark" ? "◑ LIGHT" : "◑ DARK";
        });
      })();
      function toggleTheme() {
        const c = document.documentElement.getAttribute("data-theme") || "dark";
        const n = c === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", n);
        localStorage.setItem("afm-theme", n);
        document.getElementById("themeToggle").textContent =
          n === "dark" ? "◑ LIGHT" : "◑ DARK";
        drawPreview();
        if (!playing) render();
      }
      function cv(v) {
        return getComputedStyle(document.documentElement)
          .getPropertyValue(v)
          .trim();
      }
      function isLightTheme() {
        return document.documentElement.getAttribute("data-theme") === "light";
      }
      function chartFonts() {
        return {
          axis: "13px 'Courier New', monospace",
          title: "12px 'Courier New', monospace",
          badge: "11px 'Courier New', monospace",
          small: "11px 'Courier New', monospace",
        };
      }
      function chartColors() {
        return {
          bg: cv("--canvas-bg"),
          grid1: cv("--grid1"),
          grid2: cv("--grid2"),
          axis: cv("--axis"),
          border: cv("--border2"),
          accent: cv("--accent"),
          accent2: cv("--accent2"),
          accent3: cv("--accent3"),
          accent4: cv("--accent4"),
        };
      }
      function tipDrawColors() {
        const light = isLightTheme();
        return {
          fill0: light ? "rgba(0,130,105,0.30)" : "rgba(180,215,240,0.65)",
          fill1: light ? "rgba(0,130,105,0.05)" : "rgba(160,195,220,0.12)",
          stroke: light ? "rgba(0,110,90,0.90)" : "rgba(210,235,255,0.95)",
        };
      }

      // ═══════════════════════════════════════════════════
      //  CONSTANTS
      // ═══════════════════════════════════════════════════
      const NX = 700,
        X_NM = 240,
        Y_NM = 100,
        DX = X_NM / NX;
      const CV0H = 520;
      const ML = 54,
        MR = 8,
        MT = 42,
        MB = 24;
      const PW = NX - ML - MR,
        PH = CV0H - MT - MB;
      function xC(i) {
        return ML + (i / NX) * PW;
      }
      // clamp yC so values never draw outside the plot
      function yC(nm) {
        const y = MT + PH - (nm / Y_NM) * PH;
        return Math.max(MT, Math.min(MT + PH, y));
      }

      // TIP_R: 30nm covers all tips without saturation
      // Sharp cone alpha=15: T(30nm)=112nm — large but most will be clamped gracefully
      // Blunt cone alpha=35: T(30nm)=43nm — good
      // Sphere R=20: only interacts within r<20nm anyway
      const TIP_R_NM = 30;
      const TIP_R = Math.ceil(TIP_R_NM / DX); // ~88 pixels

      // Error map
      const EML = 54,
        EMR = 8,
        EMT = 14,
        EMB = 10;
      const EPW = NX - EML - EMR,
        EPH = 70 - EMT - EMB;
      function exC(i) {
        return EML + (i / NX) * EPW;
      }

      // FD
      const FML = 58,
        FMR = 12,
        FMT = 18,
        FMB = 22;
      const FPW = NX - FML - FMR,
        FPH = 120 - FMT - FMB;

      const surface = new Float32Array(NX);
      const measured = new Float32Array(NX);
      const rawSurf = new Float32Array(NX);
      const tipProf = new Float32Array(2 * TIP_R + 1);

      // ═══════════════════════════════════════════════════
      //  STATE
      // ═══════════════════════════════════════════════════
      let currentTip = "cone";
      let currentSurf = "sine";
      let scanIdx = 0,
        playing = false,
        raf = null;
      let bounceDir = 1,
        scanMode = "loop";
      let noiseSeed = 42;
      const INV = {
        invZ: false,
        mirrorX: false,
        invTip: false,
        revScan: false,
        erosion: false,
        invErr: false,
      };

      // ═══════════════════════════════════════════════════
      //  TIP PARAMETER DEFINITIONS
      // ═══════════════════════════════════════════════════
      const TIP_DEFS = {
        cone: [
          {
            id: "angle",
            label: "Half-angle α",
            min: 3,
            max: 80,
            step: 1,
            val: 15,
            unit: "°",
          },
        ],
        sphere: [
          {
            id: "R",
            label: "Radius R",
            min: 3,
            max: 50,
            step: 1,
            val: 20,
            unit: "nm",
          },
        ],
        hyperboloid: [
          {
            id: "a",
            label: "Sharpness a",
            min: 2,
            max: 30,
            step: 1,
            val: 7,
            unit: "nm",
          },
        ],
        flat: [
          {
            id: "R",
            label: "Radius R",
            min: 3,
            max: 50,
            step: 1,
            val: 18,
            unit: "nm",
          },
        ],
        inv_sphere: [
          {
            id: "R",
            label: "Bowl radius",
            min: 3,
            max: 50,
            step: 1,
            val: 20,
            unit: "nm",
          },
          {
            id: "lip",
            label: "Flat lip width",
            min: 0,
            max: 40,
            step: 1,
            val: 8,
            unit: "nm",
          },
        ],
        asymmetric: [
          {
            id: "angle",
            label: "Half-angle α",
            min: 3,
            max: 60,
            step: 1,
            val: 20,
            unit: "°",
          },
          {
            id: "tilt",
            label: "Tilt φ",
            min: -40,
            max: 40,
            step: 1,
            val: 15,
            unit: "°",
          },
        ],
        double_tip: [
          {
            id: "angle",
            label: "Half-angle α",
            min: 3,
            max: 60,
            step: 1,
            val: 15,
            unit: "°",
          },
          {
            id: "gap",
            label: "Tip gap",
            min: 5,
            max: 80,
            step: 1,
            val: 30,
            unit: "nm",
          },
        ],
        sphere_cone: [
          {
            id: "R",
            label: "Arc Radius R",
            min: 5,
            max: 60,
            step: 1,
            val: 30,
            unit: "nm",
          },
          {
            id: "angle",
            label: "Tangent halfW",
            min: 3,
            max: 55,
            step: 1,
            val: 15,
            unit: "nm",
          },
        ],
      };
      const SURF_DEFS = {
        sine: [
          {
            id: "amp",
            label: "Amplitude",
            min: 2,
            max: 45,
            step: 1,
            val: 18,
            unit: "nm",
          },
          {
            id: "period",
            label: "Period",
            min: 10,
            max: 120,
            step: 5,
            val: 55,
            unit: "nm",
          },
        ],
        step: [
          {
            id: "height",
            label: "Height",
            min: 5,
            max: 60,
            step: 1,
            val: 28,
            unit: "nm",
          },
        ],
        spike: [
          {
            id: "height",
            label: "Height",
            min: 5,
            max: 70,

      // Initialise param stores from defaults
      const tipP = {},
        surfP = {};
      for (const [k, defs] of Object.entries(TIP_DEFS))
        tipP[k] = Object.fromEntries(defs.map((d) => [d.id, d.val]));
      for (const [k, defs] of Object.entries(SURF_DEFS))
        surfP[k] = Object.fromEntries(defs.map((d) => [d.id, d.val]));

      // ═══════════════════════════════════════════════════
      //  SLIDER UI
      // ═══════════════════════════════════════════════════
      function makeSliders(containerId, defs, store, onChange) {
        const el = document.getElementById(containerId);
        el.innerHTML = "";
        (defs || []).forEach((d) => {
          const row = document.createElement("div");

            document.getElementById("sv_" + d.id).textContent =
              store[d.id] + d.unit;
            onChange();
          });
        });
      }
      function refreshTipSliders() {
        makeSliders(
          "tipSliders",
          TIP_DEFS[currentTip],
          tipP[currentTip] || {},
          () => {
            buildTip();
            computeMeas();
            drawPreview();
            if (!playing) render();
          },
        );
      }
      function refreshSurfSliders() {
        makeSliders(
          "surfSliders",
          SURF_DEFS[currentSurf],
          surfP[currentSurf] || {},
          () => {
            buildSurf();
            applyTransforms();
            computeMeas();
            if (!playing) render();
          },
        );
      }

      // ═══════════════════════════════════════════════════
      //  TIP PROFILE  T(dc) — dc is SIGNED pixel offset from centre
      // ═══════════════════════════════════════════════════
      // Returns the height (nm) of tip solid above its reference (apex / rim plane)
      // at signed lateral offset dc_nm.
      // Dilation: measured[i] = max_j[ surface[i+j] - T(j) ]
      // Erosion:  measured[i] = min_j[ surface[i+j] + T(j) ]
      // T must be >= 0. Infinity means the tip cannot reach that offset (blocked).

      function tipT(dc_nm) {
        // dc_nm: SIGNED lateral offset in nm (positive = right, negative = left)
        const r = Math.abs(dc_nm); // radial distance for symmetric tips
        const p = tipP[currentTip] || {};
        switch (currentTip) {
          case "cone": {
            const alpha = ((p.angle || 15) * Math.PI) / 180;
            return r / Math.tan(alpha);
          }
          case "sphere": {
            const R = p.R || 20;
            return r < R ? R - Math.sqrt(R * R - r * r) : Infinity;
          }
          case "hyperboloid": {
            const a = p.a || 7;
            return Math.sqrt(r * r + a * a) - a;
          }
          case "flat": {
            const R = p.R || 18;
            return r <= R ? 0 : Infinity;
          }
          case "inv_sphere": {
            // Concave bowl + flat lip. T = tip solid height above the rim/lip plane.
            // Contact-mode AFM uses dilation: M = max(S − T), same as all other tips.
            const R = p.R || 20;
            const lip = Math.max(0, p.lip ?? 8);
            const outerR = Math.min(R + lip, TIP_R_NM);
            if (r > outerR) return Infinity;
            if (r <= R) return Math.sqrt(Math.max(0, R * R - r * r));
            return 0;
          }
          case "asymmetric": {
            // Tilt is along the signed dc direction — one side steeper, other shallower
            const alpha = ((p.angle || 20) * Math.PI) / 180;
            const tilt = ((p.tilt || 15) * Math.PI) / 180;
            // T(dc) = r/tan(alpha) + dc_nm*tan(tilt)
            // Positive tilt: right side (dc>0) gets extra height → right artifacts pushed higher
            return Math.max(0, r / Math.tan(alpha) + dc_nm * Math.tan(tilt));
          }
          case "double_tip": {
            // Two apexes at dc=-g and dc=+g
            // T(dc) = min distance to either apex / tan(alpha)
            const alpha = ((p.angle || 15) * Math.PI) / 180;
            const g = (p.gap || 30) / 2;
            const r1 = Math.abs(dc_nm - g); // distance to right apex
            const r2 = Math.abs(dc_nm + g); // distance to left apex
            return Math.min(r1, r2) / Math.tan(alpha);
          }
          case "sphere_cone": {
            // U-shape: arc for r≤halfW, straight side for r>halfW
            // T(r) = R - sqrt(R²-r²)                  [arc, C0+C1 at halfW]
            // T(r) = yTang + (r-halfW)*halfW/sv        [straight side]
            const R = p.R || 30,
              halfW = p.angle || 15;
            const sv = Math.sqrt(Math.max(1e-6, R * R - halfW * halfW));
            const yTang = R - sv;
            return r <= halfW
              ? R - Math.sqrt(Math.max(0, R * R - r * r))
              : yTang + ((r - halfW) * halfW) / sv;
          }
          default:
            return r;
        }
      }

      function buildTip() {
        // Max meaningful T: surface peaks at ~base+max_amp ≈ 55nm.
        // Artifact = T(dc), so T+surf_peak must be < Y_NM to be visible.
        // Clip kernel at Y_NM - base (= 100-25 = 75nm) so only useful entries survive.
        const T_MAX = Y_NM - 25; // 75nm — any T larger can't produce visible artifact
        for (let j = 0; j <= 2 * TIP_R; j++) {
          const dc_nm = (j - TIP_R) * DX;
          const t = tipT(dc_nm);
          tipProf[j] = isFinite(t) && t <= T_MAX ? t : 1e9;
        }
      }

      // ═══════════════════════════════════════════════════
      //  SURFACE BUILD
      // ═══════════════════════════════════════════════════
      function rand(i) {
        let x = Math.sin(i * 127.1 + noiseSeed * 311.7) * 43758.5453;
        return x - Math.floor(x);
      }

      function buildSurf() {
        const p = surfP[currentSurf] || {},
          base = 25;
        for (let i = 0; i < NX; i++) {
          const x = i * DX,
            cx = X_NM / 2,
            dx = x - cx;
          switch (currentSurf) {
            case "sine":
              rawSurf[i] =
                base +
                (p.amp || 15) * Math.sin((2 * Math.PI * x) / (p.period || 55));
              break;
            case "step":
              rawSurf[i] = i < NX * 0.48 ? base : base + (p.height || 22);
              break;
            case "spike": {
              const h = p.height || 30,
                w = (p.width || 20) / DX;
              rawSurf[i] =
                Math.abs(i - NX / 2) < w
                  ? base + h * (1 - Math.abs(i - NX / 2) / w)
                  : base;
              break;
            }
            case "hemisphere": {
              const R = p.R || 22;
              rawSurf[i] =
                Math.abs(dx) < R ? base + Math.sqrt(R * R - dx * dx) : base;
              break;
            }
            case "pit": {
              const R = p.R || 22;
              rawSurf[i] =
                Math.abs(dx) < R
                  ? base + R - Math.sqrt(R * R - dx * dx)
                  : base + R;
              break;
            }
            case "trench":
              rawSurf[i] =
                (x % (p.period || 65)) / (p.period || 65) < 0.45
                  ? base
                  : base + (p.depth || 22);
              break;
            case "rough": {
              const s = (p.scale || 10) * 0.25;
              rawSurf[i] =
                base +
                s * 4 +
                s * 3 * Math.sin((2 * Math.PI * x) / 48 + 0.9) +
                s * 2 * Math.sin((2 * Math.PI * x) / 22 + 2.1) +
                s * Math.sin((2 * Math.PI * x) / 11 + 1.4);
              break;
            }
            case "dna":
              rawSurf[i] =
                base +
                (p.amp || 18) *
                  Math.abs(Math.sin((Math.PI * x) / (p.period || 50)));
              break;
            case "chirp":
              rawSurf[i] =
                base +
                (p.amp || 15) *
                  Math.sin(
                    2 * Math.PI * x * (0.015 + (p.rate || 8) * 0.0002 * x),
                  );
              break;
            case "lattice": {
              const sp = p.spacing || 20;
              rawSurf[i] =
                base +
                (p.amp || 10) *
                  (0.5 + 0.5 * Math.cos((2 * Math.PI * x) / sp)) *
                  (0.5 + 0.5 * Math.cos((2 * Math.PI * x) / (sp * 1.15)));
              break;
            }
            default:
              rawSurf[i] = base;
          }
        }
      }

      function applyTransforms() {
        const noise =
          parseFloat(document.getElementById("noiseSlider").value) || 0;
        for (let i = 0; i < NX; i++)
          surface[i] =
            rawSurf[i] + (noise > 0 ? (rand(i) - 0.5) * 2 * noise : 0);
        if (INV.invZ) {
          let mn = Infinity,
            mx = -Infinity;
          for (let i = 0; i < NX; i++) {
            mn = Math.min(mn, surface[i]);
            mx = Math.max(mx, surface[i]);
          }
          for (let i = 0; i < NX; i++) surface[i] = mn + mx - surface[i];
        }
        if (INV.mirrorX) {
          const tmp = surface.slice();
          for (let i = 0; i < NX; i++) surface[i] = tmp[NX - 1 - i];
        }
      }

      // ═══════════════════════════════════════════════════
      //  MINKOWSKI DILATION / EROSION
      // ═══════════════════════════════════════════════════
      // CORRECT AFM contact-mode formula:
      //   Dilation:  M[i] = max_j { S[i+j] - T[j] }
      //   Erosion:   M[i] = min_j { S[i+j] + T[j] }
      //
      // Dilation is the physical default for every tip shape (including concave).
      // User toggles (erosion / invTip) can flip to erosion for teaching/duals.

      function computeMeas() {
        const finalErosion = INV.erosion !== INV.invTip;

        if (finalErosion) {
          // EROSION: M[i] = min_j { S[i+j] + T[j] }
          for (let i = 0; i < NX; i++) {
            let best = Infinity;
            for (
              let j = Math.max(-TIP_R, -i);
              j <= Math.min(TIP_R, NX - 1 - i);
              j++
            ) {
              const d = tipProf[j + TIP_R];
              if (d > 1e6) continue;
              const v = surface[i + j] + d;
              if (v < best) best = v;
            }
            measured[i] = Math.max(0, Math.min(Y_NM - 2, best));
          }
        } else {
          // DILATION: M[i] = max_j { S[i+j] - T[j] }
          for (let i = 0; i < NX; i++) {
            let best = -Infinity;
            for (
              let j = Math.max(-TIP_R, -i);
              j <= Math.min(TIP_R, NX - 1 - i);
              j++
            ) {
              const d = tipProf[j + TIP_R];
              if (d > 1e6) continue;
              const v = surface[i + j] - d;
              if (v > best) best = v;
            }
            measured[i] = Math.max(0, Math.min(Y_NM - 2, best));
          }
        }
      }

      // ═══════════════════════════════════════════════════
      //  DRAWING
      // ═══════════════════════════════════════════════════
      const cv0 = document.getElementById("cv0");
      const cx0 = cv0.getContext("2d");
      const cv1 = document.getElementById("cv1");
      const cx1 = cv1.getContext("2d");
      const cv2 = document.getElementById("cv2");
      const cx2 = cv2.getContext("2d");

      function getIdx(raw) {
        return INV.revScan ? NX - 1 - raw : raw;
      }

      // ── Main scan panel ──────────────────────────────
      function drawMain() {
        const C = chartColors();
        const F = chartFonts();
        cx0.clearRect(0, 0, NX, CV0H);
        cx0.fillStyle = C.bg;
        cx0.fillRect(0, 0, NX, CV0H);

        // Grid
        for (let y = 0; y <= Y_NM; y += 10) {
          cx0.strokeStyle = y === 0 ? C.grid1 : C.grid2;
          cx0.lineWidth = 1;
          cx0.beginPath();
          cx0.moveTo(ML, yC(y));
          cx0.lineTo(NX - MR, yC(y));
          cx0.stroke();
        }
        for (let x = 0; x <= X_NM; x += 40) {
          cx0.strokeStyle = C.grid2;
          cx0.lineWidth = 1;
          const px = xC(x / DX);
          cx0.beginPath();
          cx0.moveTo(px, MT);
          cx0.lineTo(px, MT + PH);
          cx0.stroke();
        }
        cx0.strokeStyle = C.border;
        cx0.lineWidth = 1;
        cx0.strokeRect(ML, MT, PW, PH);

        // Axis labels
        cx0.fillStyle = C.axis;
        cx0.font = F.axis;
        cx0.textAlign = "right";
        for (let y = 0; y <= Y_NM; y += 10) cx0.fillText(y, ML - 4, yC(y) + 4);
        cx0.textAlign = "center";
        for (let x = 0; x <= X_NM; x += 40)
          cx0.fillText(x + "nm", xC(x / DX), MT + PH + 18);
        cx0.save();
        cx0.translate(14, MT + PH / 2);
        cx0.rotate(-Math.PI / 2);
        cx0.fillStyle = C.axis;
        cx0.font = F.axis;
        cx0.textAlign = "center";
        cx0.fillText("Height (nm)", 0, 0);
        cx0.restore();

        // Mode badge
        cx0.fillStyle = C.accent;
        cx0.font = F.badge;
        cx0.textAlign = "left";
        cx0.fillText(INV.erosion ? "EROSION" : "DILATION", ML + 4, MT - 8);
        if (INV.invTip) {
          cx0.fillStyle = C.accent4;
          cx0.fillText("TIP⁻¹", ML + 100, MT - 8);
        }
        if (INV.revScan) {
          cx0.fillStyle = C.accent2;
          cx0.fillText("←SCAN", ML + 160, MT - 8);
        }

        cx0.save();
        cx0.beginPath();
        cx0.rect(ML, MT, PW, PH);
        cx0.clip();

        // True surface fill
        cx0.beginPath();
        cx0.moveTo(xC(0), yC(surface[0]));
        for (let i = 1; i < NX; i++) cx0.lineTo(xC(i), yC(surface[i]));
        cx0.lineTo(NX - MR, MT + PH);
        cx0.lineTo(ML, MT + PH);
        cx0.closePath();
        cx0.fillStyle = isLightTheme()
          ? "rgba(0,158,122,0.12)"
          : "rgba(0,229,176,0.08)";
        cx0.fill();

        // True surface line
        cx0.beginPath();
        cx0.strokeStyle = C.accent;
        cx0.lineWidth = 2;
        cx0.moveTo(xC(0), yC(surface[0]));
        for (let i = 1; i < NX; i++) cx0.lineTo(xC(i), yC(surface[i]));
        cx0.stroke();

        // Measured surface (up to scanIdx)
        if (scanIdx > 1) {
          // Artifact fill
          cx0.beginPath();
          for (let i = 0; i < scanIdx; i++) {
            const ri = getIdx(i);
            i === 0
              ? cx0.moveTo(xC(getIdx(0)), yC(measured[getIdx(0)]))
              : cx0.lineTo(xC(ri), yC(measured[ri]));
          }
          for (let i = scanIdx - 1; i >= 0; i--)
            cx0.lineTo(xC(getIdx(i)), yC(surface[getIdx(i)]));
          cx0.closePath();
          const artG = cx0.createLinearGradient(ML, MT, ML, MT + PH);
          artG.addColorStop(0, "rgba(255,107,53,0.18)");
          artG.addColorStop(1, "rgba(255,107,53,0.02)");
          cx0.fillStyle = artG;
          cx0.fill();

          // Measured line (glow)
          cx0.beginPath();
          cx0.strokeStyle = "rgba(255,107,53,0.18)";
          cx0.lineWidth = 6;
          cx0.moveTo(xC(getIdx(0)), yC(measured[getIdx(0)]));
          for (let i = 1; i < scanIdx; i++)
            cx0.lineTo(xC(getIdx(i)), yC(measured[getIdx(i)]));
          cx0.stroke();
          cx0.beginPath();
          cx0.strokeStyle = C.accent3;
          cx0.lineWidth = 2;
          cx0.moveTo(xC(getIdx(0)), yC(measured[getIdx(0)]));
          for (let i = 1; i < scanIdx; i++)
            cx0.lineTo(xC(getIdx(i)), yC(measured[getIdx(i)]));
          cx0.stroke();
        }

        cx0.restore(); // remove clip

        // Tip body — drawn AFTER restore so no clip issues, own save/clip inside
        if (scanIdx > 0) drawTipShape(cx0, Math.min(scanIdx - 1, NX - 1));
      }

      function getTipDrawPlacement(di) {
        // Measured height is the tip reference-plane height (dilation).
        // For concave tips, also find which sample point is the binding contact.
        if (currentTip !== "inv_sphere") {
          return { baseNm: measured[di], contactIdx: di };
        }

        const R = tipP.inv_sphere?.R || 20;
        const lip = Math.max(0, tipP.inv_sphere?.lip ?? 8);
        const outerR = Math.min(R + lip, TIP_R_NM);
        let bestBase = -Infinity;
        let contactIdx = di;

        for (
          let j = Math.max(-TIP_R, -di);
          j <= Math.min(TIP_R, NX - 1 - di);
          j++
        ) {
          const r = Math.abs(j * DX);
          if (r > outerR) continue;

          // Same geometric T as tipT / dilation kernel.
          const profile = r <= R ? Math.sqrt(Math.max(0, R * R - r * r)) : 0;
          const base = surface[di + j] - profile;
          if (base > bestBase) {
            bestBase = base;
            contactIdx = di + j;
          }
        }

        if (!isFinite(bestBase)) bestBase = measured[di];
        return {
          baseNm: Math.max(0, Math.min(Y_NM - 2, bestBase)),
          contactIdx,
        };
      }

      // ── Tip silhouette ───────────────────────────────
      function drawTipShape(g2d, si) {
        const CC = chartColors();
        const TD = tipDrawColors();
        const rawI = Math.min(si, NX - 1);
        const di = getIdx(rawI);
        const placement = getTipDrawPlacement(di);
        const ax = xC(di);
        const ay = yC(placement.baseNm);
        const sy = yC(surface[placement.contactIdx]);
        const wS = PW / X_NM,
          hS = PH / Y_NM;
        const p = tipP[currentTip] || {};

        // Tip apex sits at yC(measured[di]) — the height the tip physically rests at.
        // measured[i] = max_j[surf[j]+T(j)], so the apex IS at measured height by definition.
        // The tip body extends upward from the apex.
        const contactY = ay; // apex at MEASURED height (physically correct)
        const bodyNm = Math.min(50, Math.max((contactY - MT) / hS, 4));
        const bodyPx = bodyNm * hS;
        const tipTopY = contactY - bodyPx;

        g2d.save();
        g2d.beginPath();
        g2d.rect(ML, MT, PW, PH);
        g2d.clip();

        const tG = g2d.createLinearGradient(ax, contactY, ax, tipTopY);
        tG.addColorStop(0, TD.fill0);
        tG.addColorStop(1, TD.fill1);
        g2d.fillStyle = tG;
        g2d.strokeStyle = TD.stroke;
        g2d.lineWidth = 2;

        function sh(fn) {
          g2d.beginPath();
          fn();
          g2d.closePath();
          g2d.fill();
          g2d.stroke();
        }

        if (currentTip === "double_tip") {
          const a = ((p.angle || 15) * Math.PI) / 180,
            gp = ((p.gap || 30) * wS) / 2;
          const hw = bodyNm * Math.tan(a) * wS;
          for (const off of [-gp, gp]) {
            sh(() => {
              g2d.moveTo(ax + off, contactY); // apex at TRUE surface
              g2d.lineTo(ax + off - hw, tipTopY);
              g2d.lineTo(ax + off + hw, tipTopY);
            });
          }
        } else if (currentTip === "sphere") {
          const R = p.R || 20,
            pts = [];
          for (let k = 0; k <= 80; k++) {
            const r = (k / 80) * R,
              T = R - Math.sqrt(R * R - r * r);
            if (T <= bodyNm) pts.push([r, T]);
          }
          if (pts.length < 2) pts.push([R, bodyNm]);
          // Sphere apex is at ay (measured), body drawn from ay upward
          const tG2 = g2d.createLinearGradient(ax, ay, ax, ay - bodyPx);
          tG2.addColorStop(0, TD.fill0);
          tG2.addColorStop(1, TD.fill1);
          g2d.fillStyle = tG2;
          const sTopY = ay - bodyPx;
          sh(() => {
            g2d.moveTo(ax, ay);
            pts.forEach(([r, T]) => g2d.lineTo(ax + r * wS, ay - T * hS));
            g2d.lineTo(ax + pts[pts.length - 1][0] * wS, sTopY);
            g2d.lineTo(ax - pts[pts.length - 1][0] * wS, sTopY);
            for (let k = pts.length - 1; k >= 0; k--)
              g2d.lineTo(ax - pts[k][0] * wS, ay - pts[k][1] * hS);
          });
        } else if (currentTip === "hyperboloid") {
          const a = p.a || 7,
            pts = [];
          // Hyperboloid apex at ay (measured), body upward
          const tG2 = g2d.createLinearGradient(ax, ay, ax, ay - bodyPx);
          tG2.addColorStop(0, TD.fill0);
          tG2.addColorStop(1, TD.fill1);
          g2d.fillStyle = tG2;
          for (let k = 0; k <= 100; k++) {
            const h = (k / 100) * bodyNm,
              r = Math.sqrt((h + a) * (h + a) - a * a);
            pts.push([r, h]);
          }
          sh(() => {
            g2d.moveTo(ax, ay);
            pts.forEach(([r, h]) => g2d.lineTo(ax + r * wS, ay - h * hS));
            for (let k = pts.length - 1; k >= 0; k--)
              g2d.lineTo(ax - pts[k][0] * wS, ay - pts[k][1] * hS);
          });
        } else if (currentTip === "flat") {
          // Flat: face at measured line ay
          const tG2 = g2d.createLinearGradient(ax, ay, ax, ay - bodyPx);
          tG2.addColorStop(0, TD.fill0);
          tG2.addColorStop(1, TD.fill1);
          g2d.fillStyle = tG2;
          const rp = (p.R || 18) * wS;
          const fTopY = ay - bodyPx;
          sh(() => {
            g2d.moveTo(ax - rp, ay);
            g2d.lineTo(ax + rp, ay);
            g2d.lineTo(ax + rp, fTopY);
            g2d.lineTo(ax - rp, fTopY);
          });
          g2d.save();
          g2d.strokeStyle = "rgba(220,248,255,0.95)";
          g2d.lineWidth = 2.5;
          g2d.beginPath();
          g2d.moveTo(ax - rp, ay);
          g2d.lineTo(ax + rp, ay);
          g2d.stroke();
          g2d.restore();
        } else if (currentTip === "inv_sphere") {
          const R = p.R || 20;
          const lip = Math.max(0, p.lip ?? 8);
          const outerR = Math.min(R + lip, TIP_R_NM);
          const hw = Math.min(outerR * wS, PW / 4);
          const N = 80;

          const tG2 = g2d.createLinearGradient(ax, contactY, ax, tipTopY);
          tG2.addColorStop(0, TD.fill0);
          tG2.addColorStop(1, TD.fill1);
          g2d.fillStyle = tG2;

          // Concave bowl + flat lip on contact plane.
          sh(() => {
            g2d.moveTo(ax - hw, tipTopY);
            g2d.lineTo(ax + hw, tipTopY);
            g2d.lineTo(ax + hw, contactY);
            if (hw > R * wS + 0.5) g2d.lineTo(ax + R * wS, contactY);
            for (let k = 0; k <= N; k++) {
              const t = (k / N) * Math.PI;
              const x = R * Math.cos(t);
              const depth = R * Math.sin(t);
              g2d.lineTo(ax + x * wS, contactY - depth * hS);
            }
            if (hw > R * wS + 0.5) g2d.lineTo(ax - R * wS, contactY);
            g2d.lineTo(ax - hw, contactY);
          });

          g2d.save();
          g2d.strokeStyle = "rgba(100,200,240,0.95)";
          g2d.lineWidth = 2.5;
          g2d.beginPath();
          g2d.moveTo(ax - R * wS, contactY);
          g2d.lineTo(ax + R * wS, contactY);
          g2d.stroke();
          g2d.restore();
        } else if (currentTip === "sphere_cone") {
          // ── U-SHAPE (SolidWorks geometry, exact) ──────────────────────────────
          // Apex at (0,0) in nm, y upward.
          // Arc: centre (0, R), radius R  → passes through apex ✓
          // Tangent points: (±halfW,  R - sqrt(R²-halfW²))
          // Top corners:    (±2·halfW, yTang + halfW²/sqrt(R²-halfW²))
          //
          // NOTE: wS ≠ hS so we CANNOT use canvas.arc() — it would draw an ellipse.
          // Instead sample in nm space and convert to pixels individually.
          // ─────────────────────────────────────────────────────────────────────
          const R = p.R || 30;
          const halfW = p.angle || 15;
          const topW = halfW * 2;

          const sv = Math.sqrt(Math.max(1e-6, R * R - halfW * halfW));
          const yTang = R - sv;
          const yTop = yTang + (halfW * halfW) / sv;

          // Draw at full physical size (matches tipT kernel — no scale-to-fit shrink).
          const nmX = (x) => ax + x * wS;
          const nmY = (y) => contactY - y * hS;

          const tApex = -Math.PI / 2;
          const tR = Math.atan2(-sv, halfW);
          const tL = Math.atan2(-sv, -halfW);
          const N = 80;
          const shaftTopY = tipTopY;

          sh(() => {
            g2d.moveTo(nmX(0), nmY(0));
            for (let k = 0; k <= N; k++) {
              const t = tApex + ((tR - tApex) * k) / N;
              g2d.lineTo(nmX(R * Math.cos(t)), nmY(R + R * Math.sin(t)));
            }
            g2d.lineTo(nmX(topW), nmY(yTop));
            if (yTop * hS < bodyPx) {
              g2d.lineTo(nmX(topW), shaftTopY);
              g2d.lineTo(nmX(-topW), shaftTopY);
              g2d.lineTo(nmX(-topW), nmY(yTop));
            }
            g2d.lineTo(nmX(-halfW), nmY(yTang));
            for (let k = 0; k <= N; k++) {
              const t = tL + ((tApex - tL) * k) / N;
              g2d.lineTo(nmX(R * Math.cos(t)), nmY(R + R * Math.sin(t)));
            }
          });

          const cxY = nmY(R);
          if (cxY > tipTopY && cxY < contactY) {
            g2d.save();
            g2d.beginPath();
            g2d.arc(ax, cxY, 6, 0, Math.PI * 2);
            g2d.strokeStyle = "rgba(201,122,255,0.35)";
            g2d.lineWidth = 4;
            g2d.stroke();
            g2d.strokeStyle = "rgba(201,122,255,0.7)";
            g2d.lineWidth = 1;
            g2d.setLineDash([2, 2]);
            g2d.beginPath();
            g2d.moveTo(ax - 10, cxY);
            g2d.lineTo(ax + 10, cxY);
            g2d.stroke();
            g2d.beginPath();
            g2d.moveTo(ax, cxY - 10);
            g2d.lineTo(ax, cxY + 10);
            g2d.stroke();
            g2d.setLineDash([]);
            g2d.beginPath();
            g2d.arc(ax, cxY, 2.5, 0, Math.PI * 2);
            g2d.fillStyle = "#c97aff";
            g2d.shadowColor = "#c97aff";
            g2d.shadowBlur = 8;
            g2d.fill();
            g2d.shadowBlur = 0;
            g2d.restore();
          }
        } else {
          // cone, asymmetric — apex at TRUE surface
          const a = ((p.angle || 15) * Math.PI) / 180;
          const tilt = ((p.tilt || 0) * Math.PI) / 180;
          const lw = Math.max(3, bodyNm * (Math.tan(a) + Math.tan(tilt)) * wS);
          const rw = Math.max(3, bodyNm * (Math.tan(a) - Math.tan(tilt)) * wS);
          sh(() => {
            g2d.moveTo(ax, contactY); // apex at TRUE surface
            g2d.lineTo(ax - lw, tipTopY);
            g2d.lineTo(ax + rw, tipTopY);
          });
        }

        g2d.restore();

        const markerX =
          currentTip === "inv_sphere" ? xC(placement.contactIdx) : ax;
        const markerY = currentTip === "inv_sphere" ? sy : ay;

        // Dashed line from apex (measured) down to true surface — shows artifact gap
        if (currentTip !== "inv_sphere" && sy > ay + 2) {
          // only when there IS a gap (measured above surface)
          g2d.save();
          g2d.strokeStyle = "rgba(255,107,53,0.5)";
          g2d.lineWidth = 1;
          g2d.setLineDash([2, 3]);
          g2d.beginPath();
          g2d.moveTo(ax, ay);
          g2d.lineTo(ax, sy);
          g2d.stroke();
          g2d.setLineDash([]);
          g2d.restore();
        }

        // Contact glow dot. For concave tips, contact is often off-center.
        g2d.beginPath();
        g2d.arc(markerX, markerY, 3.5, 0, Math.PI * 2);
        g2d.fillStyle = "rgba(255,255,255,0.15)";
        g2d.fill();
        g2d.beginPath();
        g2d.arc(markerX, markerY, 2, 0, Math.PI * 2);
        g2d.fillStyle = "#fff";
        g2d.shadowColor =
          currentTip !== "inv_sphere" && sy > ay + 2 ? CC.accent3 : CC.accent;
        g2d.shadowBlur = 12;
        g2d.fill();
        g2d.shadowBlur = 0;
      }

      function drawError() {
        const C = chartColors();
        const F = chartFonts();
        cx1.clearRect(0, 0, NX, 70);
        cx1.fillStyle = C.bg;
        cx1.fillRect(0, 0, NX, 70);
        cx1.strokeStyle = C.border;
        cx1.lineWidth = 1;
        cx1.strokeRect(EML, EMT, EPW, EPH);
        cx1.fillStyle = C.axis;
        cx1.font = F.title;
        cx1.textAlign = "left";
        cx1.fillText("ARTIFACT ERROR MAP", EML + 4, EMT - 5);
        if (scanIdx < 2) return;

        let mx = 0;
        for (let i = 0; i < scanIdx; i++) {
          const e = Math.abs(measured[getIdx(i)] - surface[getIdx(i)]);
          if (e > mx) mx = e;
        }
        if (mx < 0.01) mx = 0.01;
        const bw = EPW / NX;
        for (let i = 0; i < scanIdx; i++) {
          const ri = getIdx(i);
          let t = Math.abs(measured[ri] - surface[ri]) / mx;
          if (INV.invErr) t = 1 - t;
          let r, g, b;
          if (t < 0.5) {
            r = Math.round(t * 2 * 255);
            g = Math.round(170 + t * 50);
            b = Math.round(160 * (1 - t * 2));
          } else {
            r = 255;
            g = Math.round(220 * (1 - (t - 0.5) * 2));
            b = 0;
          }
          const px = EML + i * bw;
          cx1.fillStyle = `rgb(${r},${g},${b})`;
          cx1.globalAlpha = 0.85;
          cx1.fillRect(px, EMT + EPH - t * EPH, Math.max(1, bw + 0.5), t * EPH);
        }
        cx1.globalAlpha = 1;
        cx1.fillStyle = C.accent4;
        cx1.font = F.small;
        cx1.textAlign = "right";
        cx1.fillText(
          `max ${mx.toFixed(2)} nm${INV.invErr ? " [INV]" : ""}`,
          NX - EML,
          EMT + 14,
        );
      }

      // ── Force-distance ───────────────────────────────
      function fdF(d) {
        if (d < 0) return 10 * ((-d + 1) ** 2 - 1);
        const s = 0.3 / (d + 0.3);
        return -4 * (s ** 6 - s ** 3);
      }
      function drawFD() {
        const C = chartColors();
        const F = chartFonts();
        cx2.clearRect(0, 0, NX, 120);
        cx2.fillStyle = C.bg;
        cx2.fillRect(0, 0, NX, 120);
        cx2.strokeStyle = C.border;
        cx2.lineWidth = 1;
        cx2.strokeRect(FML, FMT, FPW, FPH);
        cx2.fillStyle = C.axis;
        cx2.font = F.title;
        cx2.textAlign = "center";
        cx2.fillText("Tip–Surface Separation (nm)", FML + FPW / 2, 120 - 4);

        const maxD = 8,
          zY = FMT + FPH * 0.35,
          sF = FPH * 0.28;
        cx2.strokeStyle = C.grid1;
        cx2.lineWidth = 1;
        cx2.setLineDash([4, 4]);
        cx2.beginPath();
        cx2.moveTo(FML, zY);
        cx2.lineTo(FML + FPW, zY);
        cx2.stroke();
        cx2.setLineDash([]);

        const g = cx2.createLinearGradient(FML, FMT, FML + FPW, FMT);
        g.addColorStop(0, C.accent4);
        g.addColorStop(0.4, C.accent2);
        g.addColorStop(1, C.accent3);
        cx2.strokeStyle = g;
        cx2.lineWidth = 2;
        cx2.beginPath();
        for (let k = 0; k <= 300; k++) {
          const d = (k / 300) * maxD,
            py = zY - fdF(d) * sF,
            px = FML + (k / 300) * FPW;
          k === 0
            ? cx2.moveTo(px, Math.max(FMT, Math.min(FMT + FPH, py)))
            : cx2.lineTo(px, Math.max(FMT, Math.min(FMT + FPH, py)));
        }
        cx2.stroke();

        if (scanIdx > 0) {
          const di = getIdx(Math.min(scanIdx - 1, NX - 1));
          const sep = Math.max(0, measured[di] - surface[di]);
          const f = fdF(sep > 0 ? -sep : sep);
          const px = FML + (Math.min(sep, maxD) / maxD) * FPW,
            py = Math.max(FMT + 4, Math.min(FMT + FPH - 4, zY - f * sF));
          cx2.beginPath();
          cx2.arc(px, py, 5, 0, Math.PI * 2);
          cx2.fillStyle = C.accent;
          cx2.shadowColor = C.accent;
          cx2.shadowBlur = 10;
          cx2.fill();
          cx2.shadowBlur = 0;
          const reg =
            sep < 0.1 ? "CONTACT" : sep < 1.5 ? "NEAR-CONTACT" : "NON-CONTACT";
          const rc =
            sep < 0.1 ? C.accent3 : sep < 1.5 ? C.accent2 : C.accent4;
          cx2.fillStyle = rc;
          cx2.font = F.small;
          cx2.textAlign = "right";
          cx2.fillText(`${reg}  d=${sep.toFixed(2)}nm`, NX - FML, FMT + 14);
        }
        for (let d = 0; d <= maxD; d += 2) {
          cx2.fillStyle = C.axis;
          cx2.font = F.small;
          cx2.textAlign = "center";
          cx2.fillText(d, FML + (d / maxD) * FPW, FMT + FPH + 14);
        }
      }

      // ── Tip preview ──────────────────────────────────
      const pvCv = document.getElementById("tipPrev");
      const pvCtx = pvCv.getContext("2d");

      function drawPreview() {
        const C = chartColors();
        const TD = tipDrawColors();
        const W = pvCv.clientWidth || 248,
          H = 70;
        if (pvCv.width !== W) pvCv.width = W;
        pvCtx.clearRect(0, 0, W, H);
        pvCtx.fillStyle = C.bg;
        pvCtx.fillRect(0, 0, W, H);
        const cx = W / 2,
          apexY = H - 6,
          bodyH = H - 12;
        const NM = 50,
          wS = W / 60,
          hS = bodyH / NM;
        const p = tipP[currentTip] || {};

        const pg = pvCtx.createLinearGradient(cx, apexY, cx, apexY - bodyH);
        pg.addColorStop(0, TD.fill0);
        pg.addColorStop(1, TD.fill1);
        pvCtx.fillStyle = pg;
        pvCtx.strokeStyle = TD.stroke;
        pvCtx.lineWidth = 1.8;

        function sh(fn) {
          pvCtx.beginPath();
          fn();
          pvCtx.closePath();
          pvCtx.fill();
          pvCtx.stroke();
        }

        if (currentTip === "double_tip") {
          const a = ((p.angle || 15) * Math.PI) / 180,
            gp = ((p.gap || 30) * wS) / 2;
          const hw = NM * Math.tan(a) * wS;
          for (const off of [-gp, gp]) {
            sh(() => {
              pvCtx.moveTo(cx + off, apexY);
              pvCtx.lineTo(cx + off - hw, apexY - bodyH);
              pvCtx.lineTo(cx + off + hw, apexY - bodyH);
            });
          }
        } else if (currentTip === "sphere") {
          const R = p.R || 20,
            pts = [];
          for (let k = 0; k <= 80; k++) {
            const r = (k / 80) * R,
              T = R - Math.sqrt(R * R - r * r);
            if (T <= NM) pts.push([r, T]);
          }
          sh(() => {
            pvCtx.moveTo(cx, apexY);
            pts.forEach(([r, T]) => pvCtx.lineTo(cx + r * wS, apexY - T * hS));
            pvCtx.lineTo(
              cx + (pts[pts.length - 1] || [R])[0] * wS,
              apexY - bodyH,
            );
            pvCtx.lineTo(
              cx - (pts[pts.length - 1] || [R])[0] * wS,
              apexY - bodyH,
            );
            for (let k = pts.length - 1; k >= 0; k--)
              pvCtx.lineTo(cx - pts[k][0] * wS, apexY - pts[k][1] * hS);
          });
        } else if (currentTip === "hyperboloid") {
          const a = p.a || 7,
            pts = [];
          for (let k = 0; k <= 100; k++) {
            const h = (k / 100) * NM,
              r = Math.sqrt((h + a) * (h + a) - a * a);
            pts.push([r, h]);
          }
          sh(() => {
            pvCtx.moveTo(cx, apexY);
            pts.forEach(([r, h]) => pvCtx.lineTo(cx + r * wS, apexY - h * hS));
            for (let k = pts.length - 1; k >= 0; k--)
              pvCtx.lineTo(cx - pts[k][0] * wS, apexY - pts[k][1] * hS);
          });
        } else if (currentTip === "flat") {
          const rp = (p.R || 18) * wS;
          sh(() => {
            pvCtx.moveTo(cx - rp, apexY);
            pvCtx.lineTo(cx + rp, apexY);
            pvCtx.lineTo(cx + rp, apexY - bodyH);
            pvCtx.lineTo(cx - rp, apexY - bodyH);
          });
          pvCtx.save();
          pvCtx.strokeStyle = "rgba(220,248,255,0.95)";
          pvCtx.lineWidth = 2.5;
          pvCtx.beginPath();
          pvCtx.moveTo(cx - (p.R || 18) * wS, apexY);
          pvCtx.lineTo(cx + (p.R || 18) * wS, apexY);
          pvCtx.stroke();
          pvCtx.restore();
        } else if (currentTip === "inv_sphere") {
          const R = p.R || 20;
          const lip = Math.max(0, p.lip ?? 8);
          const outerR = Math.min(R + lip, TIP_R_NM);
          const hw = Math.min(outerR * wS, W / 2 - 3);
          const N = 60;
          sh(() => {
            pvCtx.moveTo(cx - hw, apexY - bodyH);
            pvCtx.lineTo(cx + hw, apexY - bodyH);
            pvCtx.lineTo(cx + hw, apexY);
            if (hw > R * wS + 0.5) pvCtx.lineTo(cx + R * wS, apexY);
            for (let k = 0; k <= N; k++) {
              const t = (k / N) * Math.PI;
              const x = R * Math.cos(t);
              const depth = R * Math.sin(t);
              pvCtx.lineTo(cx + x * wS, apexY - depth * hS);
            }
            if (hw > R * wS + 0.5) pvCtx.lineTo(cx - R * wS, apexY);
            pvCtx.lineTo(cx - hw, apexY);
          });
          pvCtx.save();
          pvCtx.strokeStyle = "rgba(100,200,240,0.95)";
          pvCtx.lineWidth = 2.5;
          pvCtx.beginPath();
          pvCtx.moveTo(cx - R * wS, apexY);
          pvCtx.lineTo(cx + R * wS, apexY);
          pvCtx.stroke();
          pvCtx.restore();
        } else if (currentTip === "sphere_cone") {
          const R = p.R || 30,
            halfW = p.angle || 15,
            topW = halfW * 2;
          const sv = Math.sqrt(Math.max(1e-6, R * R - halfW * halfW));
          const yTang = R - sv,
            yTop = yTang + (halfW * halfW) / sv;
          const pX = (x) => cx + x * wS,
            pY = (y) => apexY - y * hS;
          const tRn = Math.atan2(-sv, halfW),
            tLn = Math.atan2(-sv, -halfW);
          const N = 60;
          sh(() => {
            pvCtx.moveTo(pX(0), pY(0));
            for (let k = 0; k <= N; k++) {
              const t = -Math.PI / 2 + ((tRn + Math.PI / 2) * k) / N;
              pvCtx.lineTo(pX(R * Math.cos(t)), pY(R + R * Math.sin(t)));
            }
            pvCtx.lineTo(pX(topW), pY(yTop));
            if (yTop * hS < bodyH) {
              pvCtx.lineTo(pX(topW), apexY - bodyH);
              pvCtx.lineTo(pX(-topW), apexY - bodyH);
              pvCtx.lineTo(pX(-topW), pY(yTop));
            }
            pvCtx.lineTo(pX(-halfW), pY(yTang));
            for (let k = 0; k <= N; k++) {
              const t = tLn + ((-Math.PI / 2 - tLn) * k) / N;
              pvCtx.lineTo(pX(R * Math.cos(t)), pY(R + R * Math.sin(t)));
            }
          });
          const pcY = pY(R);
          if (pcY > apexY - bodyH && pcY < apexY) {
            pvCtx.save();
            pvCtx.beginPath();
            pvCtx.arc(cx, pcY, 3, 0, Math.PI * 2);
            pvCtx.strokeStyle = "rgba(201,122,255,0.6)";
            pvCtx.lineWidth = 2;
            pvCtx.stroke();
            pvCtx.beginPath();
            pvCtx.arc(cx, pcY, 1.5, 0, Math.PI * 2);
            pvCtx.fillStyle = "#c97aff";
            pvCtx.fill();
            pvCtx.restore();
          }
        } else {
          const a = ((p.angle || 15) * Math.PI) / 180;
          const tilt = ((p.tilt || 0) * Math.PI) / 180;
          const lw = Math.max(2, NM * (Math.tan(a) + Math.tan(tilt)) * wS);
          const rw = Math.max(2, NM * (Math.tan(a) - Math.tan(tilt)) * wS);
          sh(() => {
            pvCtx.moveTo(cx, apexY);
            pvCtx.lineTo(cx - lw, apexY - bodyH);
            pvCtx.lineTo(cx + rw, apexY - bodyH);
          });
        }

        // Apex dot
        pvCtx.beginPath();
        pvCtx.arc(cx, apexY, 2.5, 0, Math.PI * 2);
        pvCtx.fillStyle = C.accent;
        pvCtx.shadowColor = C.accent;
        pvCtx.shadowBlur = 8;
        pvCtx.fill();
        pvCtx.shadowBlur = 0;

        // Sample surface line
        pvCtx.save();
        pvCtx.strokeStyle = isLightTheme()
          ? "rgba(217,79,30,0.55)"
          : "rgba(255,107,53,0.5)";
        pvCtx.lineWidth = 1;
        pvCtx.setLineDash([3, 4]);
        pvCtx.beginPath();
        pvCtx.moveTo(4, apexY);
        pvCtx.lineTo(W - 4, apexY);
        pvCtx.stroke();
        pvCtx.setLineDash([]);
        pvCtx.restore();

        // Label
        if (INV.invTip) {
          pvCtx.fillStyle = C.accent4;
          pvCtx.font = chartFonts().small;
          pvCtx.textAlign = "left";
          pvCtx.fillText("INV", 4, 12);
        }
        const names = {
          cone: "CONE",
          sphere: "SPHERE",
          hyperboloid: "HYPER",
          flat: "FLAT",
          inv_sphere: "CONCAVE",
          asymmetric: "ASYM",
          double_tip: "DOUBLE",
          sphere_cone: "CONE+SPH",
        };
        pvCtx.fillStyle = isLightTheme()
          ? "rgba(26,40,56,0.85)"
          : "rgba(180,210,225,0.9)";
        pvCtx.font = chartFonts().small;
        pvCtx.textAlign = "right";
        pvCtx.fillText(names[currentTip] || currentTip, W - 4, 12);
      }

      // ── Stats ────────────────────────────────────────
      function updateStats() {
        if (scanIdx < 2) {
          document.getElementById("stArt").textContent = "—";
          document.getElementById("stRms").textContent = "—";
          return;
        }
        let mx = 0,
          rms = 0;
        for (let i = 0; i < scanIdx; i++) {
          const e = Math.abs(measured[getIdx(i)] - surface[getIdx(i)]);
          if (e > mx) mx = e;
          rms += e * e;
        }
        document.getElementById("stArt").textContent = mx.toFixed(2) + " nm";
        document.getElementById("stRms").textContent =
          Math.sqrt(rms / scanIdx).toFixed(2) + " nm";
      }

      // ── Master render ────────────────────────────────
      function render() {
        drawMain();
        drawError();
        drawFD();
        updateStats();
      }

      // ═══════════════════════════════════════════════════
      //  ANIMATION
      // ═══════════════════════════════════════════════════
      function step() {
        const spd = parseInt(document.getElementById("spdSlider").value) || 3;
        if (scanMode === "bounce") {
          scanIdx += spd * bounceDir;
          if (scanIdx >= NX) {
            scanIdx = NX - 1;
            bounceDir = -1;
          }
          if (scanIdx <= 0) {
            scanIdx = 0;
            bounceDir = 1;
          }
        } else {
          scanIdx = Math.min(scanIdx + spd, NX);
          if (scanIdx >= NX) {
            if (scanMode === "loop") scanIdx = 0;
            else {
              playing = false;
              document.getElementById("playBtn").textContent = "▶ PLAY";
              render();
              return;
            }
          }
        }
        render();
        document.getElementById("ibar").textContent =
          `Scan: ${(scanIdx * DX).toFixed(1)}/${X_NM}nm  ·  ${currentTip.replace(/_/g, " ")}  ·  ${currentSurf}  ·  ${INV.erosion ? "EROSION" : "DILATION"}`;
        if (playing) raf = requestAnimationFrame(step);
      }

      function doReset() {
        cancelAnimationFrame(raf);
        scanIdx = 0;
        playing = false;
        bounceDir = 1;
        document.getElementById("playBtn").textContent = "▶ PLAY";
        render();
        document.getElementById("ibar").textContent = "Ready — press PLAY";
      }

      // ═══════════════════════════════════════════════════
      //  CONTROLS
      // ═══════════════════════════════════════════════════
      document.getElementById("playBtn").addEventListener("click", () => {
        playing = !playing;
        document.getElementById("playBtn").textContent = playing
          ? "⏸ PAUSE"
          : "▶ PLAY";
        if (playing) step();
        else cancelAnimationFrame(raf);
      });

      document
        .getElementById("spdSlider")
        .addEventListener("input", function () {
          document.getElementById("spdVal").textContent = this.value;
        });

      document
        .getElementById("noiseSlider")
        .addEventListener("input", function () {
          document.getElementById("noiseVal").textContent =
            (+this.value).toFixed(1) + " nm";
          noiseSeed = Math.floor(Math.random() * 1000);
          applyTransforms();
          computeMeas();
          if (!playing) render();
        });

      document.getElementById("tipBtns").addEventListener("click", (e) => {
        const t = e.target.closest("[data-tip]");
        if (!t) return;
        currentTip = t.dataset.tip;
        document
          .querySelectorAll("#tipBtns .btn")
          .forEach((b) =>
            b.classList.toggle("on", b.dataset.tip === currentTip),
          );
        refreshTipSliders();
        buildTip();
        computeMeas();
        drawPreview();
        if (!playing) render();
      });

      document.getElementById("surfBtns").addEventListener("click", (e) => {
        const t = e.target.closest("[data-surf]");
        if (!t) return;
        currentSurf = t.dataset.surf;
        document
          .querySelectorAll("#surfBtns .btn")
          .forEach((b) =>
            b.classList.toggle("on", b.dataset.surf === currentSurf),
          );
        refreshSurfSliders();
        buildSurf();
        applyTransforms();
        computeMeas();
        doReset();
      });

      function tog(k) {
        INV[k] = !INV[k];
        document.getElementById("tg_" + k).classList.toggle("on", INV[k]);
        buildTip();
        applyTransforms();
        computeMeas();
        drawPreview();
        doReset();
      }

      function setMode(m) {
        scanMode = m;
        ["Single", "Loop", "Bounce"].forEach((x) =>
          document
            .getElementById("m" + x)
            .classList.toggle("on", x.toLowerCase() === m),
        );
      }

      // ═══════════════════════════════════════════════════
      //  RANDOMIZE
      // ═══════════════════════════════════════════════════
      function randomizeAll() {
        const tips = Object.keys(TIP_DEFS),
          surfs = Object.keys(SURF_DEFS);
        currentTip = tips[Math.floor(Math.random() * tips.length)];
        currentSurf = surfs[Math.floor(Math.random() * surfs.length)];
        for (const d of TIP_DEFS[currentTip] || []) {
          tipP[currentTip][d.id] =
            Math.round((d.min + Math.random() * (d.max - d.min)) / d.step) *
            d.step;
        }
        for (const d of SURF_DEFS[currentSurf] || []) {
          surfP[currentSurf][d.id] =
            Math.round((d.min + Math.random() * (d.max - d.min)) / d.step) *
            d.step;
        }
        document.getElementById("noiseSlider").value = Math.random() * 6;
        document.getElementById("noiseVal").textContent =
          (+document.getElementById("noiseSlider").value).toFixed(1) + " nm";
        noiseSeed = Math.floor(Math.random() * 1000);
        ["invZ", "mirrorX", "invTip", "revScan", "erosion", "invErr"].forEach(
          (k) => {
            INV[k] = Math.random() < 0.2;
            document.getElementById("tg_" + k).classList.toggle("on", INV[k]);
          },
        );
        document
          .querySelectorAll("#tipBtns .btn")
          .forEach((b) =>
            b.classList.toggle("on", b.dataset.tip === currentTip),
          );
        document
          .querySelectorAll("#surfBtns .btn")
          .forEach((b) =>
            b.classList.toggle("on", b.dataset.surf === currentSurf),
          );
        refreshTipSliders();
        refreshSurfSliders();
        buildTip();
        buildSurf();
        applyTransforms();
        computeMeas();
        drawPreview();
        doReset();
      }

      // ═══════════════════════════════════════════════════
      //  HEIGHT MAP EXPORT
      // ═══════════════════════════════════════════════════
      function downloadBlob(content, filename, mimeType) {
        const blob =
          content instanceof Blob
            ? content
            : new Blob([content], { type: mimeType || "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function exportBaseName() {
        const tp = tipP[currentTip] || {};
        const sp = surfP[currentSurf] || {};
        const tipStr = Object.entries(tp)
          .map(([k, v]) => `${k}${v}`)
          .join("_");
        const surfStr = Object.entries(sp)
          .map(([k, v]) => `${k}${v}`)
          .join("_");
        return `${currentTip}_${tipStr}__${currentSurf}_${surfStr}`;
      }

      function computeFullLineStats() {
        let mx = 0,
          rms = 0,
          hMin = Infinity,
          hMax = -Infinity;
        for (let i = 0; i < NX; i++) {
          const e = Math.abs(measured[i] - surface[i]);
          if (e > mx) mx = e;
          rms += e * e;
          hMin = Math.min(hMin, surface[i], measured[i]);
          hMax = Math.max(hMax, surface[i], measured[i]);
        }
        if (hMin === hMax) hMax = hMin + 1;
        return {
          err_max_nm: mx,
          err_rms_nm: Math.sqrt(rms / NX),
          h_min_nm: hMin,
          h_max_nm: hMax,
        };
      }

      function buildParamsJson() {
        const stats = computeFullLineStats();
        const finalErosion = INV.erosion !== INV.invTip;
        return {
          simulator: "2d",
          tip: currentTip,
          tip_params: { ...(tipP[currentTip] || {}) },
          surface: currentSurf,
          surface_params: { ...(surfP[currentSurf] || {}) },
          grid: { NX, x_nm: X_NM, dx_nm: DX },
          noise_nm: parseFloat(document.getElementById("noiseSlider").value) || 0,
          inverts: { ...INV },
          operation: finalErosion ? "erosion" : "dilation",
          png_scale: {
            h_min_nm: stats.h_min_nm,
            h_max_nm: stats.h_max_nm,
            decode:
              "h_nm = uint16 / 65535 * (h_max_nm - h_min_nm) + h_min_nm",
          },
          stats: {
            err_max_nm: stats.err_max_nm,
            err_rms_nm: stats.err_rms_nm,
          },
        };
      }

      function lineToCSV(arr) {
        const lines = ["index,x_nm,height_nm"];
        for (let i = 0; i < NX; i++) {
          lines.push(`${i},${(i * DX).toFixed(4)},${arr[i].toFixed(6)}`);
        }
        return lines.join("\n");
      }

      function lineProfileToCSV() {
        const lines = ["index,x_nm,true_nm,measured_nm"];
        for (let i = 0; i < NX; i++) {
          lines.push(
            `${i},${(i * DX).toFixed(4)},${surface[i].toFixed(6)},${measured[i].toFixed(6)}`,
          );
        }
        return lines.join("\n");
      }

      function heightToUint16(h, hMin, hMax) {
        const t = (h - hMin) / (hMax - hMin);
        return Math.max(0, Math.min(65535, Math.round(t * 65535)));
      }

      function crc32(bytes) {
        let c = 0xffffffff;
        for (let i = 0; i < bytes.length; i++) {
          c ^= bytes[i];
          for (let k = 0; k < 8; k++) {
            c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          }
        }
        return (c ^ 0xffffffff) >>> 0;
      }

      function pngChunk(type, data) {
        const td = new TextEncoder().encode(type);
        const len = data.length;
        const buf = new Uint8Array(4 + 4 + len + 4);
        const view = new DataView(buf.buffer);
        view.setUint32(0, len);
        buf.set(td, 4);
        buf.set(data, 8);
        const crcData = new Uint8Array(4 + len);
        crcData.set(td);
        crcData.set(data, 4);
        view.setUint32(8 + len, crc32(crcData));
        return buf;
      }

      async function deflateZlib(data) {
        if (typeof CompressionStream === "undefined") {
          throw new Error("CompressionStream not supported in this browser");
        }
        const cs = new CompressionStream("deflate");
        const writer = cs.writable.getWriter();
        writer.write(data);
        writer.close();
        const chunks = [];
        const reader = cs.readable.getReader();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        let total = 0;
        for (const ch of chunks) total += ch.length;
        const out = new Uint8Array(total);
        let off = 0;
        for (const ch of chunks) {
          out.set(ch, off);
          off += ch.length;
        }
        return out;
      }

      async function lineToUint16PNG(arr, hMin, hMax) {
        const width = NX,
          height = 1;
        const rowLen = 1 + width * 2;
        const raw = new Uint8Array(rowLen);
        raw[0] = 0;
        for (let c = 0; c < width; c++) {
          const u = heightToUint16(arr[c], hMin, hMax);
          const o = 1 + c * 2;
          raw[o] = (u >> 8) & 0xff;
          raw[o + 1] = u & 0xff;
        }
        const idat = await deflateZlib(raw);
        const sig = new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]);
        const ihdr = new Uint8Array(13);
        const iv = new DataView(ihdr.buffer);
        iv.setUint32(0, width);
        iv.setUint32(4, height);
        ihdr[8] = 16;
        ihdr[9] = 0;
        ihdr[10] = 0;
        ihdr[11] = 0;
        ihdr[12] = 0;
        const parts = [
          sig,
          pngChunk("IHDR", ihdr),
          pngChunk("IDAT", idat),
          pngChunk("IEND", new Uint8Array(0)),
        ];
        let n = 0;
        for (const p of parts) n += p.length;
        const png = new Uint8Array(n);
        let pos = 0;
        for (const p of parts) {
          png.set(p, pos);
          pos += p.length;
        }
        return new Blob([png], { type: "image/png" });
      }

      function ensureExportReady() {
        applyTransforms();
        computeMeas();
      }

      async function exportHeightMap(kind) {
        ensureExportReady();
        const base = exportBaseName();
        const stats = computeFullLineStats();
        const { h_min_nm, h_max_nm } = stats;

        if (kind === "true_csv" || kind === "all") {
          downloadBlob(
            lineToCSV(surface),
            `true_surface_${base}.csv`,
            "text/csv",
          );
        }
        if (kind === "meas_csv" || kind === "all") {
          downloadBlob(
            lineToCSV(measured),
            `measured_afm_${base}.csv`,
            "text/csv",
          );
        }
        if (kind === "profile_csv" || kind === "all") {
          downloadBlob(
            lineProfileToCSV(),
            `profile_${base}.csv`,
            "text/csv",
          );
        }
        if (kind === "true_png" || kind === "all") {
          downloadBlob(
            await lineToUint16PNG(surface, h_min_nm, h_max_nm),
            `true_surface_${base}_16bit.png`,
            "image/png",
          );
        }
        if (kind === "meas_png" || kind === "all") {
          downloadBlob(
            await lineToUint16PNG(measured, h_min_nm, h_max_nm),
            `measured_afm_${base}_16bit.png`,
            "image/png",
          );
        }
        if (kind === "params" || kind === "all") {
          downloadBlob(
            JSON.stringify(buildParamsJson(), null, 2),
            `params_${base}.json`,
            "application/json",
          );
        }
      }

      document
        .getElementById("exportTrueCsvBtn")
        .addEventListener("click", () => exportHeightMap("true_csv"));
      document
        .getElementById("exportMeasCsvBtn")
        .addEventListener("click", () => exportHeightMap("meas_csv"));
      document
        .getElementById("exportTruePngBtn")
        .addEventListener("click", () => exportHeightMap("true_png"));
      document
        .getElementById("exportMeasPngBtn")
        .addEventListener("click", () => exportHeightMap("meas_png"));
      document
        .getElementById("exportParamsBtn")
        .addEventListener("click", () => exportHeightMap("params"));
      document
        .getElementById("exportAllBtn")
        .addEventListener("click", () => exportHeightMap("all"));

      // ═══════════════════════════════════════════════════
      //  INIT
      // ═══════════════════════════════════════════════════
      refreshTipSliders();
      refreshSurfSliders();
      buildTip();
      buildSurf();
      applyTransforms();
      computeMeas();
      drawPreview();
      render();
      setMode("loop");
      window.addEventListener("resize", () => {
        drawPreview();
        if (!playing) render();
      });
    </script>
  </body>
</html>
